# Testes usam um banco H2 em memória, isolado do banco de desenvolvimento
spring.datasource.url=jdbc:h2:mem:casaemdia-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.jwt.secret=segredo-de-teste-com-mais-de-32-caracteres
app.jwt.expiracao-horas=1
