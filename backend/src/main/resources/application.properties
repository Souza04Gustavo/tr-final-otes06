spring.application.name=casaemdia
server.port=8080

# Banco H2 em arquivo (criado automaticamente em ./data)
spring.datasource.url=jdbc:h2:file:./data/casaemdia
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 (apenas para desenvolvimento): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: o segredo pode ser sobrescrito pela variável de ambiente JWT_SECRET (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:casa-em-dia-segredo-de-desenvolvimento-troque-em-producao}
app.jwt.expiracao-horas=168

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
